name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec-validation:
    name: Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install spec tools
        run: |
          npm install -g yamllint @redocly/cli @stoplight/spectral-cli
          curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | sh

      - name: YAML syntax check
        run: yamllint docs/specs/openapi.yaml

      - name: OpenAPI structure check
        run: npx @redocly/cli lint docs/specs/openapi.yaml

      - name: Spectral policy check
        run: npx @stoplight/spectral-cli lint docs/specs/openapi.yaml

      - name: Breaking-change diff check
        run: |
          if [ -f docs/specs/baseline/openapi.yaml ]; then
            oasdiff breaking --fail-on-diff docs/specs/baseline/openapi.yaml docs/specs/openapi.yaml
          else
            echo "No baseline spec found, skipping breaking-change check"
          fi

