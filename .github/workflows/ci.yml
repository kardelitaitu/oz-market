name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache: true

      - name: Format check
        working-directory: backend
        run: cargo fmt --check

      - name: Clippy
        working-directory: backend
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo check
        working-directory: backend
        run: cargo check --workspace

      - name: Lib tests
        working-directory: backend
        run: cargo test --lib

      - name: Wrap_fn microbench (release)
        working-directory: backend
        # The wrap_fn middleware added in fc157c4 runs on every HTTP request
        # to count requests_total for /metrics. This test runs the microbench
        # in release mode to surface the eprintln! timing output and catch
        # any future regression above 800ns/req. The test also appends a
        # JSON line to data/microbench/requests_overhead.log; we feed the
        # current commit SHA in via MARKETPLACE_MICROBENCH_COMMIT so the
        # log records per-commit measurements instead of "local".
        env:
          MARKETPLACE_MICROBENCH_COMMIT: ${{ github.sha }}
        run: cargo test --release -p oz-market-server --lib -- wrap_fn_overhead --nocapture

      - name: Publish microbench trend to job summary
        if: always()
        # Reads the last line of data/microbench/requests_overhead.log (the
        # line this run just appended) and surfaces it in the GitHub Actions
        # run summary so the trend is visible without scraping the file.
        # Filter out `null` ns_per_req (sub-noise samples — wrap ≤ baseline)
        # so a single noisy run doesn't appear as a 0ns/req measurement.
        shell: bash
        run: |
          LOG="data/microbench/requests_overhead.log"
          if [ -f "$LOG" ]; then
            LAST=$(tail -1 "$LOG")
            echo "## Wrap_fn microbench (last sample)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            echo "$LAST" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            NS=$(echo "$LAST" | python3 -c "import json,sys; d=json.load(sys.stdin); v=d.get('ns_per_req'); print('sub-noise' if v is None else f'{v:.0f}ns/req')")
            echo "::notice title=wrap_fn_overhead::$NS"
          else
            echo "::warning title=wrap_fn_microbench::log file not found at $LOG"
          fi

  server-postgres:
    name: Server Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Bootstrap schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://marketplace:marketplace@127.0.0.1:${{ job.services.postgres.ports[5432] }}/marketplace?sslmode=disable"
        run: cargo run -p oz-market-server --bin bootstrap_schema

      - name: Postgres integration tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://marketplace:marketplace@127.0.0.1:${{ job.services.postgres.ports[5432] }}/marketplace?sslmode=disable"
        run: cargo test -p oz-market-server --test postgres_flows -- --nocapture

  mcp-smoke:
    name: MCP Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: MCP tool smoke test
        working-directory: backend
        env:
          MARKETPLACE_MCP_ALLOW_DEV_CLAIMS: "1"
        run: |
          cargo run --release -p oz-market-mcp --bin mcp_tester 2>&1 | tee mcp-test.log
          grep -q "\[FAIL\]" mcp-test.log && echo "FAILURES DETECTED" && exit 1 || echo "ALL PASS"
