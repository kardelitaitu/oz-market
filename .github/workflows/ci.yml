name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cargo check
        working-directory: backend
        run: cargo check

      - name: MCP launcher smoke tests
        working-directory: backend
        run: cargo test -p marketplace-mcp --lib --tests -- --nocapture

      - name: Shared contract parity tests
        working-directory: backend
        run: cargo test -p marketplace-api-contract --test mobile_contract -- --nocapture
