name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cargo-check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting (cargo fmt)
        working-directory: backend
        run: cargo fmt --check

      - name: Run clippy
        working-directory: backend
        run: cargo clippy -- -A clippy::too_many_arguments -A clippy::manual_find -A clippy::useless_format -A clippy::range_plus_one -A clippy::borrow_deref_ref -A clippy::get_first

      - name: Cargo check
        working-directory: backend
        run: cargo check
