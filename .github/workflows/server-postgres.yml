name: Server Postgres

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  postgres:
    name: Server Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Bootstrap schema helper
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://marketplace:marketplace@127.0.0.1:${{ job.services.postgres.ports[5432] }}/marketplace?sslmode=disable"
        run: cargo run -p marketplace-server --bin bootstrap_schema

      - name: Server Postgres tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://marketplace:marketplace@127.0.0.1:${{ job.services.postgres.ports[5432] }}/marketplace?sslmode=disable"
        run: cargo test -p marketplace-server --test postgres_flows -- --nocapture
