# Production deployment for oz-market-server + PostgreSQL.
# Start with:
#   docker compose up -d
# Stop with:
#   docker compose down
#
# Environment variables can be overridden in a .env file or inline:
#   MARKETPLACE_API_KEY=my-secret docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
    volumes:
      - marketplace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # MARKETPLACE_PORT is for the docker port mapping only; the server
      # itself reads MARKETPLACE_BIND to know which address to listen on.
      - "${MARKETPLACE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://marketplace:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/marketplace
      MARKETPLACE_BIND: 0.0.0.0:3000
      MARKETPLACE_API_KEY: ${MARKETPLACE_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      # Caches sized for 4GB VPS
      LISTING_CACHE_MAX_MB: 200
      SEARCH_CACHE_MAX_MB: 100
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  marketplace_data:
