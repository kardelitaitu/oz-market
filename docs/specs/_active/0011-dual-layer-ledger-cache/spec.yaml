acceptance:
  - An in-memory cache using DashMap is implemented for tracking agent balances
  - A write-through caching model writes updates immediately to the DB via the cache
  - Cache hits prevent redundant database queries for balance checks
non_goals:
  - Asynchronous background batching (deferred to 0013)
risks:
  - In-memory drift if DB updates bypass the cache (mitigated by using cache as the exclusive modifier)
