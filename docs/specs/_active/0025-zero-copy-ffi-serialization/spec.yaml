id: 0025-zero-copy-ffi-serialization
title: Zero-Copy FFI Serialization
status: active
owner: mobile-team
implementer: agent
priority: P2
area:
  - mobile
  - tauri
files:
  code:
    - mobile/marketplace/src-tauri/src/main.rs
  docs:
