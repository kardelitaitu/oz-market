[package]
name = "oz-market-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
oz-market-api-contract = { path = "../crates/api-contract" }
oz-market-auth-core = { path = "../crates/auth-core" }
oz-market-server = { path = "../server" }

# MCP framework
rmcp = { version = "0.2", features = ["client", "transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
chrono = "0.4"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
