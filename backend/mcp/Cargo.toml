[package]
name = "marketplace-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
marketplace-api-contract = { path = "../crates/api-contract" }
marketplace-auth-core = { path = "../crates/auth-core" }
marketplace-server = { path = "../server" }

# MCP framework
rmcp = { version = "0.2", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = "0.4"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
