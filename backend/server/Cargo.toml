[package]
name = "oz-market-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
oz-market-api-contract = { path = "../crates/api-contract" }
oz-market-auth-core = { path = "../crates/auth-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "macros", "migrate", "rust_decimal", "chrono", "uuid"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util", "sync", "fs"] }
tokio-stream = "0.1"
chrono = "0.4"
actix-web = "4"
actix-rt = "2"
dashmap = "6"
moka = { version = "0.12", features = ["future", "sync"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
# Production hardening: tracing + metrics
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.12"
uuid = { version = "1", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
serde_yaml = "0.9"
num_cpus = "1.16"
futures = "0.3"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Benchmark suite
hdrhistogram = { version = "7.5", features = ["serialization"] }
clap = { version = "4", features = ["derive", "env"] }
sysinfo = "0.32"
thiserror = "2"


tonic = "0.12"
prost = "0.13"


# OpenAPI generation
utoipa = "5"
utoipa-swagger-ui = "8"

[[bin]]
name = "schema_test"
path = "src/bin/schema_test.rs"

[[bin]]
name = "bench_concurrent"
path = "src/bin/bench_concurrent.rs"

[[bin]]
name = "http_bench"
path = "src/bin/http_bench.rs"

[[bin]]
name = "populate_db"
path = "src/bin/populate_db.rs"

[[bin]]
name = "pg_search_bench"
path = "src/bin/pg_search_bench.rs"

[[bin]]
name = "sse_bench"
path = "src/bin/sse_bench.rs"

[[bin]]
name = "bench_suite"
path = "src/bin/bench_suite.rs"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search_bench"
harness = false
