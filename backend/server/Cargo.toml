[package]
name = "marketplace-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
marketplace-api-contract = { path = "../crates/api-contract" }
marketplace-auth-core = { path = "../crates/auth-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "io-util"] }
chrono = "0.4"
actix-web = "4"
actix-rt = "2"
moka = { version = "0.12", features = ["future", "sync"] }
reqwest = { version = "0.11", features = ["json"] }
# Production hardening: tracing + metrics
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
metrics = "0.22"
metrics-exporter-prometheus = "0.12"
uuid = "1"
serde_yaml = "0.9"
num_cpus = "1.16"

# OpenAPI generation
utoipa = "3"
utoipa-swagger-ui = "3"

[[bin]]
name = "schema_test"
path = "src/bin/schema_test.rs"

[[bin]]
name = "bench_concurrent"
path = "src/bin/bench_concurrent.rs"

[[bin]]
name = "http_bench"
path = "src/bin/http_bench.rs"

[[bin]]
name = "populate_db"
path = "src/bin/populate_db.rs"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
